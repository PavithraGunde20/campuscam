
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusCam phone</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

<style>
:root{
  --bg:#0f1114;
  --panel:#1b1e23;
  --line:#2c3037;
  --fg:#e8e9ec;
  --mute:#9aa0aa;
  --acc:#3b82f6;
  --bad:#ef4444;
  --ok:#22c55e;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:14px;
}

h1{
  font-size:18px;
  margin:0 0 4px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

button,select,input{
  font:inherit;
  color:var(--fg);
  background:#262a31;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
}

button.primary{
  background:var(--acc);
  border-color:var(--acc);
  font-weight:600;
}

button.big{
  width:100%;
  padding:16px;
  font-size:18px;
  margin:10px 0;
}

button:disabled{
  opacity:.6;
}

.video-box{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

video{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.pill{
  display:inline-block;
  padding:3px 10px;
  border-radius:99px;
  font-size:12px;
  background:#333;
}

.pill.on{
  background:var(--ok);
  color:#000;
}

.pill.live,.pill.err{
  background:var(--bad);
}

details{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  margin-top:12px;
}

label{
  display:block;
  margin:10px 0 4px;
  color:var(--mute);
  font-size:12px;
}

input{
  width:100%;
}

.note{
  color:var(--mute);
  font-size:13px;
}

#res{
  margin-top:5px;
}

@media(max-width:600px){
  .wrap{padding:10px}
  .row.controls button{flex:1}
}
</style>
</head>

<body>
<div class="wrap">

  <h1 id="title">CampusCam phone</h1>

  <div class="row">
    <span id="mq" class="pill">not connected</span>
    <span id="viewers" class="pill">0 viewers</span>
    <span id="res" class="note"></span>
  </div>

  <button id="btnStart" class="primary big">Start camera</button>

  <div class="video-box">
    <video id="preview" autoplay playsinline muted></video>
  </div>

  <div class="row controls" style="margin-top:10px">

    <label style="margin:0">Quality</label>

    <select id="quality">
      <option value="1080">1080p</option>
      <option value="720" selected>720p</option>
      <option value="480">480p (weak network)</option>
    </select>

    <button id="btnFlip">Flip camera</button>
    <button id="btnStop">Stop</button>

  </div>

  <p class="note">
    Place the phone horizontally in the holder, with the back camera
    facing forward. Keep this page open with the screen on.
    Connect a power bank for longer operation.
  </p>

  <details id="setup">
    <summary>Settings</summary>

    <label>Campus number (1–4)</label>
    <input id="sCampus" type="number" min="1" max="4" value="1">

    <label>Broker WebSocket URL</label>
    <input id="sUrl" placeholder="wss://xxxx.emqxsl.com:8084/mqtt">

    <label>Username</label>
    <input id="sUser">

    <label>Password</label>
    <input id="sPass" type="password">

    <label>TURN relay (optional)</label>

    <div class="row">
      <input id="tUrl" placeholder="turn:relay.example.com:3478" style="flex:2">
      <input id="tUser" placeholder="user" style="flex:1">
      <input id="tPass" placeholder="password" style="flex:1">
    </div>

    <div class="row" style="margin-top:10px">
      <button id="btnSaveCfg" class="primary">Save and connect</button>
    </div>
  </details>

</div>

<script>
const $ = id => document.getElementById(id);

const LS = 'campuscam.phone';

let cfg = loadCfg();

// ----------------------------------------------------
// CONFIGURATION

function loadCfg(){

  let c = {
    url:'',
    user:'campuscam-console',
    pass:'',
    campus:1,
    name:'',
    turn:{url:'',user:'',pass:''}
  };

  try{
    Object.assign(
      c,
      JSON.parse(localStorage.getItem(LS)||'{}')
    );
  }catch(e){}

  const m = location.hash.match(/cfg=([A-Za-z0-9_-]+)/);

  if(m){

    try{

      const b = m[1].replace(/-/g,'+').replace(/_/g,'/');

      const json = decodeURIComponent(
        escape(atob(b+'==='.slice((b.length+3)%4)))
      );

      Object.assign(c,JSON.parse(json));

      try{
        localStorage.setItem(LS,JSON.stringify(c));
      }catch(e){}

      history.replaceState(null,'',location.pathname);

    }catch(e){
      console.warn('Bad setup link',e);
    }
  }

  return c;
}

function saveCfg(){

  try{
    localStorage.setItem(LS,JSON.stringify(cfg));
  }catch(e){}
}

function base(){
  return `campus${cfg.campus}/video`;
}

function iceServers(){

  const s = [
    {urls:'stun:stun.l.google.com:19302'}
  ];

  if(cfg.turn && cfg.turn.url){

    s.push({
      urls:cfg.turn.url,
      username:cfg.turn.user,
      credential:cfg.turn.pass
    });
  }

  return s;
}

// ----------------------------------------------------
// MQTT

let client = null;

function pill(t,c){

  const p = $('mq');

  p.textContent = t;
  p.className = 'pill '+(c||'');
}

function connect(){

  if(client){

    try{
      client.end(true);
    }catch(e){}

    client = null;
  }

  $('title').textContent =
    (cfg.name || ('Campus '+cfg.campus))+
    ' · CampusCam phone';

  if(!cfg.url){

    pill('open Settings');
    $('setup').open = true;

    return;
  }

  pill('connecting…');

  client = mqtt.connect(cfg.url,{

    username:cfg.user,
    password:cfg.pass,

    clientId:
      'campuscam-phone'+cfg.campus+'-'+
      Math.random().toString(36).slice(2,8),

    clean:true,
    reconnectPeriod:3000,

    will:{
      topic:base()+'/status',
      payload:'offline',
      retain:true,
      qos:1
    }
  });

  client.on('connect',()=>{

    pill('connected','on');

    client.subscribe(base()+'/to-phone');

    pub('/status',stream?'online':'offline',true);

    if(stream){
      publishInfo();
    }
  });

  client.on('reconnect',()=>{
    pill('reconnecting…');
  });

  client.on('close',()=>{
    pill('not connected');
  });

  client.on('error',e=>{
    pill('error: '+(e.message||e),'err');
  });

  client.on('message',(t,b)=>{

    try{
      onMsg(JSON.parse(b.toString()));
    }catch(e){
      console.warn(e);
    }
  });
}

function pub(sub,obj,retain){

  if(client && client.connected){

    client.publish(
      base()+sub,
      typeof obj==='string'?obj:JSON.stringify(obj),
      {
        qos:sub==='/status'?1:0,
        retain:!!retain
      }
    );
  }
}

// ----------------------------------------------------
// CAMERA AND LANDSCAPE PROCESSING

let stream = null;

// Physical camera stream
let cameraStream = null;

// Canvas output stream, used only when source is portrait
let landscapeStream = null;

// Canvas processing variables
let landscapeCanvas = null;
let landscapeTimer = null;
let cameraVideo = null;

let facing = 'environment';
let wakeLock = null;

const Q = {
  1080:[1920,1080],
  720:[1280,720],
  480:[854,480]
};

function cameraConstraints(){

  const [w,h] = Q[$('quality').value];

  return {
    facingMode:{ideal:facing},
    width:{ideal:w},
    height:{ideal:h},
    frameRate:{ideal:30,max:30}
  };
}

// Return the physical camera track.
// Zoom is applied to this track, not the canvas output.

function videoTrack(){

  return cameraStream &&
    cameraStream.getVideoTracks()[0];
}

// Stop only the canvas processing resources.

function stopLandscapeProcessor(){

  if(landscapeTimer){

    clearInterval(landscapeTimer);
    landscapeTimer = null;
  }

  if(landscapeStream){

    landscapeStream.getTracks().forEach(t=>t.stop());
    landscapeStream = null;
  }

  if(cameraVideo){

    cameraVideo.pause();
    cameraVideo.srcObject = null;
    cameraVideo = null;
  }

  landscapeCanvas = null;
}


// Create a landscape output from a portrait camera.

async function createLandscapeStream(sourceStream){

  const sourceTrack = sourceStream.getVideoTracks()[0];

  if(!sourceTrack){
    throw new Error('Camera video track not found');
  }

  const settings = sourceTrack.getSettings();

  const sourceWidth = settings.width || 720;
  const sourceHeight = settings.height || 1280;

  // If the physical camera is already landscape,
  // use its original stream without conversion.

  if(sourceWidth >= sourceHeight){
    return sourceStream;
  }

  console.log(
    'Portrait camera detected:',
    sourceWidth + 'x' + sourceHeight
  );

  // Create a 16:9 landscape canvas.

  const canvas = document.createElement('canvas');

  canvas.width = 1280;
  canvas.height = 720;

  landscapeCanvas = canvas;

  const ctx = canvas.getContext('2d');

  if(!ctx){
    throw new Error('Could not create landscape canvas');
  }

  // Hidden video element receives the original camera stream.

  cameraVideo = document.createElement('video');

  cameraVideo.srcObject = sourceStream;
  cameraVideo.muted = true;
  cameraVideo.playsInline = true;

  await cameraVideo.play();

  // Wait for camera dimensions.

  if(
    cameraVideo.readyState < 2 ||
    !cameraVideo.videoWidth ||
    !cameraVideo.videoHeight
  ){

    await new Promise(resolve=>{

      cameraVideo.addEventListener(
        'loadeddata',
        resolve,
        {once:true}
      );

    });
  }

  function drawFrame(){

    if(
      !cameraVideo ||
      cameraVideo.readyState < 2 ||
      !cameraVideo.videoWidth ||
      !cameraVideo.videoHeight
    ){
      return;
    }

    ctx.save();

    // Clear the previous frame.

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    // UPDATED ROTATION:
    // Rotate portrait video 90 degrees counterclockwise.

    ctx.translate(0, canvas.height);
    ctx.rotate(-Math.PI / 2);

    // Draw the original portrait camera frame.

    ctx.drawImage(
      cameraVideo,
      0,
      0,
      cameraVideo.videoWidth,
      cameraVideo.videoHeight
    );

    ctx.restore();
  }

  // Draw initial frame.

  drawFrame();

  // Continue drawing at approximately 30 FPS.

  landscapeTimer = setInterval(drawFrame, 33);

  // Capture the landscape canvas.

  landscapeStream = canvas.captureStream(30);

  // Preserve original camera audio.

  const outputTracks = [

    ...landscapeStream.getVideoTracks(),

    ...sourceStream.getAudioTracks()

  ];

  return new MediaStream(outputTracks);
}


// ----------------------------------------------------
// START CAMERA

async function startCamera(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      'Camera access requires HTTPS. Open the CampusCam HTTPS website.'
    );
  }

  // Stop previous canvas processor.

  stopLandscapeProcessor();

  // Stop previous physical camera.

  if(cameraStream){

    cameraStream.getTracks().forEach(t=>t.stop());

    cameraStream = null;
  }

  stream = null;

  // Request camera.

  cameraStream = await navigator.mediaDevices.getUserMedia({

    video:cameraConstraints(),

    audio:{
      echoCancellation:false,
      noiseSuppression:false,
      autoGainControl:true
    }
  });

  // Convert portrait source to landscape when necessary.

  stream = await createLandscapeStream(cameraStream);

  // Show the processed stream on the phone preview.

  $('preview').srcObject = stream;

  await $('preview').play().catch(e=>{
    console.warn('Preview playback issue:',e);
  });

  // Replace video/audio tracks in existing WebRTC connections.

  for(const p of peers.values()){

    const senders = p.pc.getSenders();

    for(const sender of senders){

      const kind = sender.track ? sender.track.kind : null;

      if(!kind) continue;

      const newTrack = stream.getTracks().find(
        t=>t.kind===kind
      );

      if(newTrack){

        await sender.replaceTrack(newTrack);
      }
    }
  }

  keepAwake();

  publishInfo();

  pub('/status','online',true);

  $('btnStart').textContent = 'Camera running';
  $('btnStart').disabled = true;
}

// ----------------------------------------------------
// CAMERA INFORMATION

function publishInfo(){

  const physicalTrack = videoTrack();

  if(!physicalTrack) return;

  const sourceSettings = physicalTrack.getSettings();

  const outputTrack = stream &&
    stream.getVideoTracks()[0];

  const outputSettings = outputTrack
    ? outputTrack.getSettings()
    : {};

  const cap = physicalTrack.getCapabilities
    ? physicalTrack.getCapabilities()
    : {};

  const width = outputSettings.width || 1280;
  const height = outputSettings.height || 720;

  const sourceWidth = sourceSettings.width || 0;
  const sourceHeight = sourceSettings.height || 0;

  const isLandscape = width >= height;

  const info = {

    width:width,
    height:height,

    aspectRatio:width/height,

    orientation:isLandscape
      ? 'landscape'
      : 'portrait',

    sourceWidth:sourceWidth,
    sourceHeight:sourceHeight,

    sourceOrientation:
      sourceWidth >= sourceHeight
        ? 'landscape'
        : 'portrait',

    facing:facing,

    zoom:cap.zoom
      ? {
          min:cap.zoom.min,
          max:cap.zoom.max,
          step:cap.zoom.step
        }
      : null,

    zoomNow:sourceSettings.zoom || null
  };

  const sourceNote =
    sourceWidth < sourceHeight
      ? ' · rotated from portrait'
      : '';

  $('res').textContent =
    `${width}x${height} · `+
    (isLandscape?'LANDSCAPE':'PORTRAIT')+
    sourceNote+
    (cap.zoom
      ? ` · zoom ${cap.zoom.min}–${cap.zoom.max}x`
      : '');

  $('res').style.color =
    isLandscape ? '#22c55e' : '#ef4444';

  pub('/info',info,true);

  console.log('Physical camera:',sourceSettings);
  console.log('Output video:',info);
}

// ----------------------------------------------------
// ZOOM

async function setZoom(v){

  const t = videoTrack();

  if(!t) return;

  try{

    await t.applyConstraints({
      advanced:[{zoom:v}]
    });

    publishInfo();

  }catch(e){

    console.warn('Zoom not supported:',e);
  }
}

// ----------------------------------------------------
// KEEP SCREEN AWAKE

async function keepAwake(){

  try{

    if('wakeLock' in navigator){

      wakeLock = await navigator.wakeLock.request('screen');
    }

  }catch(e){}
}

document.addEventListener('visibilitychange',()=>{

  if(
    document.visibilityState==='visible' &&
    stream
  ){

    keepAwake();
  }
});

// ----------------------------------------------------
// STOP CAMERA

function stopCamera(){

  for(const id of [...peers.keys()]){
    closePeer(id);
  }

  pub('/status','offline',true);

  stopLandscapeProcessor();

  if(cameraStream){

    cameraStream.getTracks().forEach(t=>t.stop());

    cameraStream = null;
  }

  stream = null;

  $('preview').srcObject = null;

  $('btnStart').textContent = 'Start camera';
  $('btnStart').disabled = false;

  $('res').textContent = '';

  try{

    if(wakeLock){
      wakeLock.release();
      wakeLock = null;
    }

  }catch(e){}
}

// ----------------------------------------------------
// WEBRTC

const peers = new Map();

function showViewers(){

  const n = [...peers.values()].filter(
    p=>p.pc.connectionState==='connected'
  ).length;

  const v = $('viewers');

  v.textContent =
    n+(n===1?' viewer':' viewers');

  v.className = 'pill '+(n?'live':'');
}

function closePeer(id){

  const p = peers.get(id);

  if(p){

    try{
      p.pc.close();
    }catch(e){}

    peers.delete(id);
  }

  showViewers();
}

async function newCall(id){

  if(!stream) return;

  closePeer(id);

  const pc = new RTCPeerConnection({
    iceServers:iceServers()
  });

  const p = {
    pc,
    q:Promise.resolve()
  };

  peers.set(id,p);

  stream.getTracks().forEach(t=>{
    pc.addTrack(t,stream);
  });

  pc.onicecandidate = e=>{

    if(e.candidate){

      pub('/to-console/'+id,{
        type:'ice',
        candidate:e.candidate
      });
    }
  };

  pc.onconnectionstatechange = ()=>{

    showViewers();

    if(
      ['failed','closed'].includes(pc.connectionState) &&
      peers.get(id)===p
    ){

      closePeer(id);
    }
  };

  const offer = await pc.createOffer();

  await pc.setLocalDescription(offer);

  pub('/to-console/'+id,{
    type:'offer',
    sdp:pc.localDescription.sdp
  });
}

function onMsg(m){

  if(m.type==='call'){

    return newCall(m.from);
  }

  if(m.type==='zoom'){

    return setZoom(Number(m.value));
  }

  if(m.type==='flip'){

    facing =
      facing==='environment'
        ? 'user'
        : 'environment';

    if(stream){
      return startCamera().catch(alertBox);
    }

    return;
  }

  const p = peers.get(m.from);

  if(!p) return;

  p.q = p.q.then(async()=>{

    if(m.type==='answer'){

      await p.pc.setRemoteDescription({
        type:'answer',
        sdp:m.sdp
      });
    }

    else if(m.type==='ice' && m.candidate){

      try{
        await p.pc.addIceCandidate(m.candidate);
      }catch(e){}
    }

  }).catch(e=>console.warn(e));
}

// ----------------------------------------------------
// ERROR DISPLAY

function alertBox(e){

  console.error(e);

  pill(
    'camera error: '+(e.message||e),
    'err'
  );

  $('btnStart').textContent = 'Start camera';
  $('btnStart').disabled = false;
}

// ----------------------------------------------------
// BUTTONS

$('btnStart').onclick = ()=>{

  startCamera().catch(alertBox);
};

$('btnStop').onclick = stopCamera;

$('btnFlip').onclick = ()=>{

  facing =
    facing==='environment'
      ? 'user'
      : 'environment';

  if(stream){
    startCamera().catch(alertBox);
  }
};

// Change camera quality.

$('quality').onchange = async()=>{

  const t = videoTrack();

  if(!t) return;

  try{

    await t.applyConstraints({
      width:{
        ideal:Q[$('quality').value][0]
      },

      height:{
        ideal:Q[$('quality').value][1]
      },

      frameRate:{
        ideal:30,
        max:30
      }
    });

    publishInfo();

  }catch(e){

    console.warn('Could not change camera quality:',e);
  }
};

// ----------------------------------------------------
// SETTINGS

function fillForm(){

  $('sCampus').value = cfg.campus;
  $('sUrl').value = cfg.url;
  $('sUser').value = cfg.user;
  $('sPass').value = cfg.pass;

  $('tUrl').value = cfg.turn.url || '';
  $('tUser').value = cfg.turn.user || '';
  $('tPass').value = cfg.turn.pass || '';
}

$('btnSaveCfg').onclick = ()=>{

  if(stream){
    pub('/status','offline',true);
  }

  cfg.campus = Math.min(
    4,
    Math.max(1,Number($('sCampus').value)||1)
  );

  cfg.url = $('sUrl').value.trim();
  cfg.user = $('sUser').value.trim();
  cfg.pass = $('sPass').value;

  cfg.turn = {
    url:$('tUrl').value.trim(),
    user:$('tUser').value.trim(),
    pass:$('tPass').value
  };

  saveCfg();

  $('setup').open = false;

  connect();
};

// ----------------------------------------------------
// INITIALIZE

fillForm();
connect();

</script>
</body>
</html>
