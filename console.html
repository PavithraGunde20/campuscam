<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusCam - Campus 1 Console</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

<style>
:root {
  --bg:#0b0f17;
  --bg2:#111827;
  --panel:#151c28;
  --panel2:#1b2433;
  --line:#263043;
  --fg:#eef1f6;
  --mute:#8d99ad;
  --acc:#3b6cf6;
  --acc2:#5b8cff;
  --ok:#1fa855;
  --bad:#e23b3b;
  --c-red:#d7262b;
  --c-green:#16994a;
  --c-blue:#2b2a7c;
  --hdr:64px;
}

* { box-sizing:border-box; }

html,body { height:100%; }

body {
  margin:0;
  color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, #1b2a4a55, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #16994a1c, transparent 60%),
    var(--bg);
  overflow:hidden;
}

/* ---------- header ---------- */
header {
  height:var(--hdr);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  background:linear-gradient(180deg,#141c2b,#0f1522);
  border-bottom:1px solid var(--line);
  position:relative;
}
header::after {               /* CHIREC colour stripe */
  content:"";
  position:absolute; left:0; right:0; bottom:-1px; height:3px;
  background:linear-gradient(90deg,var(--c-red) 0 33%,var(--c-green) 33% 66%,var(--c-blue) 66% 100%);
  opacity:.9;
}
.logo {
  height:46px;
  padding:5px 10px;
  background:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  box-shadow:0 2px 10px #0006;
}
.logo img { height:36px; display:block; }
.titles { flex:1; min-width:0; }
.titles h1 { font-size:18px; margin:0; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titles h1 b { color:var(--acc2); font-weight:700; }
.titles .sub { font-size:12px; color:var(--mute); }

.pill {
  padding:5px 12px;
  border-radius:99px;
  font-size:12px;
  background:#2a3242;
  color:#c8cfdb;
  display:inline-flex; align-items:center; gap:6px;
}
.pill::before { content:""; width:7px; height:7px; border-radius:50%; background:#6b7486; }
.pill.on { background:#123522; color:#7be3a4; }
.pill.on::before { background:#2ee27a; box-shadow:0 0 8px #2ee27a; }
.pill.err { background:#3a1416; color:#ff9a9a; }
.pill.err::before { background:var(--bad); }

button,select,input {
  font:inherit;
  color:var(--fg);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 11px;
}
button { cursor:pointer; transition:background .15s,border-color .15s,transform .05s; }
button:hover { border-color:#3b4760; background:#212c3e; }
button:active { transform:translateY(1px); }
button.primary { background:var(--acc); border-color:var(--acc); }
button.danger { background:linear-gradient(180deg,#e5484d,#c4262c); border-color:#c4262c; color:#fff; }
button.danger:hover { background:linear-gradient(180deg,#ef5a5f,#cf2f35); }
button.rec { background:var(--bad); border-color:var(--bad); }

/* ---------- layout: everything on one screen ---------- */
main {
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:14px;
  padding:14px;
  height:calc(100vh - var(--hdr));
}

.leftcol {
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
  min-height:0;
}

#grid {
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

/* video sized to fit the remaining height (no page scroll) */
.tile {
  position:relative;
  width:min(100%, calc((100vh - var(--hdr) - 28px - 14px - 190px) * 16 / 9));
  aspect-ratio:16/9;
  background:#000;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 30px #0008;
}
.tile.sel { outline:2px solid #3b6cf655; outline-offset:2px; }

.tile video {
  width:100%; height:100%;
  object-fit:contain;
  display:block;
  background:#000;
}

.tile .lab {
  position:absolute; left:10px; top:10px;
  display:flex; gap:6px; align-items:center;
}
.tile .name {
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);
  padding:3px 10px;
  border-radius:7px;
  font-weight:600;
}
.tag { font-size:11px; padding:3px 8px; border-radius:6px; background:#3a4150; font-weight:600; }
.tag.live { background:var(--bad); animation:pulse 1.6s infinite; }
.tag.on { background:#1f5133; }
.tag.off { background:#3a4150; color:#c7ccd6; }
@keyframes pulse { 50% { opacity:.65; } }

.tile .info {
  position:absolute; left:10px; bottom:8px; right:10px;
  display:flex; justify-content:space-between;
  font-size:12px; color:#e6e8ee;
  text-shadow:0 1px 2px #000;
}
.tile .empty {
  position:absolute; inset:0;
  display:flex; flex-direction:column; gap:8px;
  align-items:center; justify-content:center;
  color:var(--mute);
}
.tile .empty::before { content:"📷"; font-size:30px; opacity:.5; }

/* bottom cards under the video */
.bottom {
  flex:0 0 190px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  min-height:0;
}

.card {
  background:linear-gradient(180deg,var(--panel),#121926);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

h3 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--mute);
  margin:0 0 8px;
  display:flex; align-items:center; gap:8px;
}
h3::before { content:""; width:3px; height:12px; border-radius:2px; background:var(--acc2); }

.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

#presets {
  display:flex; flex-wrap:wrap; gap:6px;
  overflow:auto; min-height:0; flex:1 1 auto;
  align-content:flex-start;
  margin-bottom:8px;
}
.preset { display:inline-flex; }
.preset button { padding:5px 9px; font-size:13px; }
.preset button:first-child { border-radius:8px 0 0 8px; background:#1d2a44; border-color:#2c3e62; }
.preset button:last-child { border-radius:0 8px 8px 0; border-left:0; color:var(--mute); padding:5px 8px; }
.preset button:last-child:hover { color:#ff8f8f; }

.camgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }

/* ---------- right control panel ---------- */
aside {
  background:linear-gradient(180deg,var(--panel),#121926);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  min-width:0;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
aside h2 { font-size:16px; margin:0; display:flex; align-items:center; gap:8px; }
aside h2::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--c-green); box-shadow:0 0 8px var(--c-green); }

.stat {
  display:grid;
  grid-template-columns:auto 1fr;
  gap:3px 12px;
  font-size:13px;
  background:#0f1520;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
}
.stat span:nth-child(odd) { color:var(--mute); }

.move {
  display:grid;
  grid-template-columns:150px 1fr;
  gap:12px;
  align-items:center;
}

#joy {
  width:150px; height:150px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #1a2333 0 40%, #121a27 41% 100%);
  border:2px solid var(--line);
  position:relative;
  touch-action:none;
  box-shadow:inset 0 2px 12px #0009;
}
#joy::before, #joy::after {            /* crosshair */
  content:""; position:absolute; background:#2a3549;
}
#joy::before { left:50%; top:12px; bottom:12px; width:1px; }
#joy::after  { top:50%; left:12px; right:12px; height:1px; }

#knob {
  width:48px; height:48px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #7ea2ff, var(--acc) 60%, #2a4fc4);
  position:absolute;
  left:49px; top:49px;
  box-shadow:0 4px 12px #000a, inset 0 1px 2px #fff5;
  z-index:1;
}

.nud {
  display:grid;
  grid-template-columns:repeat(3,42px);
  grid-auto-rows:42px;
  gap:6px;
  justify-content:center;
}
.nud button { padding:0; font-size:16px; }
#btnHome { background:#1d2a44; border-color:#2c3e62; }

.speedbox label {
  display:flex; justify-content:space-between;
  font-size:12px; color:var(--mute); margin-bottom:4px;
}
.speedbox label b { color:var(--fg); }
input[type=range] { width:100%; padding:0; accent-color:var(--acc2); background:transparent; border:0; }

#btnStop {
  width:100%;
  padding:12px;
  font-weight:700;
  font-size:15px;
  letter-spacing:.02em;
  border-radius:11px;
  box-shadow:0 6px 18px #c4262c44;
}

.kbd { font-size:11px; color:var(--mute); text-align:center; margin-top:-6px; }

dialog {
  background:var(--panel);
  color:var(--fg);
  border:1px solid var(--line);
  border-radius:14px;
  max-width:620px;
  width:94vw;
}
dialog::backdrop { background:#0009; backdrop-filter:blur(2px); }
dialog label { display:block; margin:10px 0 4px; color:var(--mute); font-size:12px; }
dialog input { width:100%; }
.links input { font-size:11px; }
.note { font-size:12px; color:var(--mute); }

/* small screens: stack and allow scrolling */
@media (max-width:1000px), (max-height:560px) {
  body { overflow:auto; }
  main { grid-template-columns:1fr; height:auto; }
  .tile { width:100%; }
  .bottom { grid-template-columns:1fr; flex:none; }
  .card { overflow:visible; }
}
@media (max-width:600px) {
  .titles h1 { font-size:15px; }
  .logo img { height:28px; }
  .logo { height:38px; }
}
</style>
</head>

  <div class="titles">
    <h1><b>CampusCam</b> Console - Campus 1</h1>
    <div class="sub">Remote pan-tilt camera control</div>
  </div>
  <span id="pill" class="pill">not connected</span>
  <button id="btnSettings">⚙ Settings</button>
</header>

<main>

  <div class="leftcol">

    <!-- CAMPUS 1 VIDEO -->
    <section id="grid">
      <div class="tile sel" id="tile0">
        <video autoplay playsinline muted></video>
        <div class="empty">Waiting for Campus 1 video...</div>
        <div class="lab">
          <span class="name">Campus 1</span>
          <span class="tag vid off">phone offline</span>
          <span class="tag head off">head offline</span>
        </div>
        <div class="info">
          <span class="pos"></span>
          <span class="bat"></span>
        </div>
      </div>
    </section>

    <div class="bottom">
      <div class="card">
        <h3>Presets</h3>
        <div id="presets"></div>
        <div class="row">
          <input id="presetName" placeholder="name, e.g. stage" maxlength="10" style="flex:1;min-width:0">
          <button id="btnSave" class="primary">Save here</button>
        </div>
      </div>

      <div class="card">
        <h3>Phone camera</h3>
        <label class="note" style="display:flex;justify-content:space-between">
          <span>Zoom</span><span id="zoomVal"></span>
        </label>
        <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" disabled>
        <div class="camgrid">
          <button id="btnFlip">⟲ Flip camera</button>
          <button id="btnRecall">↻ Reconnect video</button>
          <button id="btnRec">● Record</button>
          <button id="btnSnap">📸 Snapshot</button>
        </div>
        <p class="note" id="recNote" style="margin:6px 0 0"></p>
      </div>
    </div>
  </div>

  <!-- CONTROL PANEL -->
  <aside>
    <h2 id="selTitle">Campus 1</h2>
    <div class="stat" id="stat"></div>

    <div>
      <h3>Move</h3>
      <div class="move">
        <div id="joy"><div id="knob"></div></div>
        <div class="nud">
          <span></span><button data-n="0,2" title="Tilt up">▲</button><span></span>
          <button data-n="-5,0" title="Pan left">◀</button>
          <button id="btnHome" title="Home (0, 0)">⌂</button>
          <button data-n="5,0" title="Pan right">▶</button>
          <span></span><button data-n="0,-2" title="Tilt down">▼</button><span></span>
        </div>
      </div>
    </div>
    <div class="kbd">Drag the joystick · arrow keys nudge · Space stops</div>

    <div class="speedbox">
      <h3>Speed</h3>
      <label><span>Pan / tilt speed</span><b id="speedVal">20 °/s</b></label>
      <input id="speed" type="range" min="1" max="45" step="1" value="20">
    </div>

    <button id="btnStop" class="danger">■ Stop all motors</button>
  </aside>
</main>

<!-- SETTINGS -->
<dialog id="dlg">
  <h2 style="margin-top:0">Campus 1 Settings</h2>

  <label>Broker WebSocket URL</label>
  <input id="sUrl" placeholder="wss://xxxx.emqxsl.com:8084/mqtt">

  <div class="row">
    <div style="flex:1">
      <label>Username</label>
      <input id="sUser" placeholder="campuscam-console">
    </div>
    <div style="flex:1">
      <label>Password</label>
      <input id="sPass" type="password">
    </div>
  </div>

  <label>Campus name</label>
  <input id="n1" value="Campus 1">

  <label>TURN relay (optional, only if video stays connecting)</label>
  <div class="row">
    <input id="tUrl" placeholder="turn:relay.example.com:3478" style="flex:2">
    <input id="tUser" placeholder="user" style="flex:1">
    <input id="tPass" placeholder="password" style="flex:1">
  </div>

  <label>Campus 1 phone setup link (send privately)</label>
  <div class="links" id="links"></div>

  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button id="dlgClose">Cancel</button>
    <button id="dlgSave" class="primary">Save and connect</button>
  </div>
</dialog>

<script>

// --------------------------------------------------
// SETTINGS
// --------------------------------------------------

const LS = 'campuscam.console';

function defaults() {
  return {
    url:'',
    user:'campuscam-console',
    pass:'',
    names:['Campus 1'],
    turn:{url:'',user:'',pass:''}
  };
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS)||'{}');
    const d = defaults();

    return {
      ...d,
      ...saved,
      names:[saved.names?.[0] || 'Campus 1'],
      turn:{...d.turn,...saved.turn}
    };
  } catch(e) {
    return defaults();
  }
}

let cfg = load();

function save() {
  try {
    localStorage.setItem(LS,JSON.stringify(cfg));
  } catch(e) {}
}

const $ = id => document.getElementById(id);

const myId = 'c' + Math.random().toString(36).slice(2,10);

// --------------------------------------------------
// WEBRTC CONFIGURATION
// --------------------------------------------------

function iceServers() {
  const s = [{urls:'stun:stun.l.google.com:19302'}];

  if(cfg.turn.url) {
    s.push({
      urls:cfg.turn.url,
      username:cfg.turn.user,
      credential:cfg.turn.pass
    });
  }

  return s;
}

// --------------------------------------------------
// CAMPUS 1 STATE ONLY
// --------------------------------------------------

const C = [{
  n:1,
  head:'offline',
  state:null,
  presets:[],
  phone:'offline',
  info:null,
  pc:null,
  stream:null,
  rtc:'—'
}];

const sel = 0;

const grid = $('grid');

function tile(i) {
  return $('tile0');
}

function render() {

  const c = C[0];
  const t = tile(0);

  t.querySelector('.name').textContent = cfg.names[0] || 'Campus 1';

  const v = t.querySelector('.vid');
  const live = c.rtc === 'connected';

  v.textContent = live
    ? 'LIVE'
    : (c.phone === 'online' ? 'video '+c.rtc : 'phone offline');

  v.className = 'tag vid ' + (
    live ? 'live' : (c.phone === 'online' ? 'on' : 'off')
  );

  const h = t.querySelector('.head');
  h.textContent = 'head '+c.head;
  h.className = 'tag head '+(c.head === 'online' ? 'on' : 'off');

  t.querySelector('.empty').style.display = live ? 'none':'flex';

  const s = c.state;

  t.querySelector('.pos').textContent = s
    ? `pan ${s.pan.toFixed(1)}°  tilt ${s.tilt.toFixed(1)}°`
    : '';

  const hasBat = s && typeof s.bat === 'number';

  t.querySelector('.bat').textContent = hasBat
    ? `${s.bat.toFixed(2)} V${s.batLow?' LOW':''}`
    : '';

  $('selTitle').textContent = cfg.names[0] || 'Campus 1';

  $('stat').innerHTML = s ? `
    <span>Head</span><span>${c.head}${s.moving?' · moving':''}</span>
    <span>Position</span><span>pan ${s.pan.toFixed(1)}°, tilt ${s.tilt.toFixed(1)}°</span>
    ${hasBat ? `<span>Battery</span><span style="color:${s.batLow?'var(--bad)':'inherit'}">${s.bat.toFixed(2)} V</span>` : ''}
    <span>Speed</span><span>${s.speed} °/s</span>
    <span>Wi-Fi</span><span>${s.rssi} dBm</span>
    <span>Phone</span><span>${c.phone}, video ${c.rtc}${c.info?` · ${c.info.width}x${c.info.height}`:''}</span>
  ` : `
    <span>Head</span><span>${c.head}</span>
    <span>Phone</span><span>${c.phone}, video ${c.rtc}</span>
  `;

  if(s) {
    const sp = $('speed');
    if(!sp.dataset.drag && typeof s.speed === 'number') {
      sp.value = s.speed;
      $('speedVal').textContent = s.speed+' °/s';
    }
  }

  const p = $('presets');
  p.innerHTML = '';

  (c.presets || []).forEach(pr => {
    const d = document.createElement('div');
    d.className = 'preset';

    const go = document.createElement('button');
    go.textContent = `${pr.name} (${pr.pan}°, ${pr.tilt}°)`;
    go.onclick = () => cmd({cmd:'preset',name:pr.name});

    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = 'Delete';
    del.onclick = () => cmd({cmd:'delete',name:pr.name});

    d.append(go,del);
    p.appendChild(d);
  });

  if(!c.presets || !c.presets.length) {
    p.innerHTML = '<p class="note">No presets yet.</p>';
  }

  const z = $('zoom');
  const zi = c.info && c.info.zoom;

  if(zi) {
    z.disabled = false;
    z.min = zi.min;
    z.max = zi.max;
    z.step = zi.step || 0.1;

    if(!z.dataset.drag) z.value = c.info.zoomNow || zi.min;

    $('zoomVal').textContent = Number(z.value).toFixed(1)+'x';
  } else {
    z.disabled = true;
    $('zoomVal').textContent =
      c.phone === 'online'
        ? '(not supported by this phone browser)'
        : '';
  }
}

// --------------------------------------------------
// MQTT CONNECTION
// --------------------------------------------------

let client = null;

function pill(txt,cls) {
  const p = $('pill');
  p.textContent = txt;
  p.className = 'pill '+(cls||'');
}

function connect() {

  if(client) {
    try { client.end(true); } catch(e) {}
    client = null;
  }

  if(!cfg.url) {
    pill('set up in Settings');
    return;
  }

  pill('connecting…');

  client = mqtt.connect(cfg.url,{
    username:cfg.user,
    password:cfg.pass,
    clientId:'campuscam-'+myId,
    clean:true,
    reconnectPeriod:3000,
    connectTimeout:10000
  });

  client.on('connect',() => {

    pill('connected','on');

    client.subscribe([
      'campus1/cam/state',
      'campus1/cam/presets',
      'campus1/cam/status',
      'campus1/video/status',
      'campus1/video/info',
      `campus1/video/to-console/${myId}`
    ]);

    if(C[0].phone === 'online') call(C[0]);

  });

  client.on('reconnect',() => pill('reconnecting…'));
  client.on('close',() => pill('not connected'));
  client.on('error',e => pill('error: '+(e.message||e),'err'));
  client.on('message',onMsg);
}

function pub(topic,obj,retain) {
  if(client && client.connected) {
    client.publish(
      topic,
      typeof obj === 'string' ? obj : JSON.stringify(obj),
      {qos:0,retain:!!retain}
    );
  }
}

function cmd(o) {
  pub('campus1/cam/cmd',o);
}

// --------------------------------------------------
// MQTT MESSAGE HANDLER
// --------------------------------------------------

function onMsg(topic,buf) {

  const m = topic.match(/^campus1\/(cam|video)\/(.+)$/);
  if(!m) return;

  const c = C[0];
  const kind = m[1];
  const sub = m[2];
  const text = buf.toString();

  if(kind === 'cam') {

    if(sub === 'status') {
      c.head = text;
    }

    else if(sub === 'state') {
      try { c.state = JSON.parse(text); } catch(e) {}
    }

    else if(sub === 'presets') {
      try { c.presets = JSON.parse(text).presets || []; } catch(e) {}
    }

  } else {

    if(sub === 'status') {
      const was = c.phone;
      c.phone = text;

      if(text === 'online' && was !== 'online') call(c);
      if(text !== 'online') hangup(c);
    }

    else if(sub === 'info') {
      try { c.info = JSON.parse(text); } catch(e) {}
    }

    else if(sub.startsWith('to-console/')) {
      try { signal(c,JSON.parse(text)); } catch(e) {
        console.warn(e);
      }
    }
  }

  render();
}

// --------------------------------------------------
// WEBRTC VIDEO
// --------------------------------------------------

function hangup(c) {

  if(c.pc) {
    try { c.pc.close(); } catch(e) {}
  }

  c.pc = null;
  c.rtc = '—';

  tile(0).querySelector('video').srcObject = null;
}

function call(c) {

  hangup(c);

  const pc = new RTCPeerConnection({
    iceServers:iceServers()
  });

  c.pc = pc;
  c.rtc = 'connecting';

  pc.ontrack = e => {
    c.stream = e.streams[0];
    tile(0).querySelector('video').srcObject = c.stream;
  };

  pc.onicecandidate = e => {
    if(e.candidate) {
      pub('campus1/video/to-phone',{
        type:'ice',
        from:myId,
        candidate:e.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {

    if(c.pc !== pc) return;

    c.rtc = pc.connectionState;
    render();

    if(pc.connectionState === 'failed') {
      setTimeout(() => {
        if(c.pc === pc && c.phone === 'online') call(c);
      },4000);
    }
  };

  pub('campus1/video/to-phone',{
    type:'call',
    from:myId
  });

  render();
}

function signal(c,msg) {
  const pc = c.pc;
  if(!pc) return;

  pc._q = (pc._q || Promise.resolve())
    .then(() => handleSignal(pc,c,msg))
    .catch(e => console.warn(e));
}

async function handleSignal(pc,c,msg) {

  if(c.pc !== pc) return;

  if(msg.type === 'offer') {

    await pc.setRemoteDescription({
      type:'offer',
      sdp:msg.sdp
    });

    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);

    pub('campus1/video/to-phone',{
      type:'answer',
      from:myId,
      sdp:pc.localDescription.sdp
    });

  } else if(msg.type === 'ice' && msg.candidate) {

    try {
      await pc.addIceCandidate(msg.candidate);
    } catch(e) {}
  }
}

// --------------------------------------------------
// JOYSTICK
// --------------------------------------------------

const joy = $('joy');
const knob = $('knob');

let jx = 0;
let jy = 0;
let dragging = false;
let joyTimer = null;

function joyR() {
  return (joy.clientWidth - knob.offsetWidth) / 2;
}

function setKnob(x,y) {
  const R = joyR();
  knob.style.left = (R + x*R)+'px';
  knob.style.top = (R - y*R)+'px';
}

function joyMove(e) {

  const r = joy.getBoundingClientRect();

  const k = knob.offsetWidth/2;
  let x = (e.clientX-r.left-r.width/2)/(r.width/2-k);
  let y = -(e.clientY-r.top-r.height/2)/(r.height/2-k);

  const L = Math.hypot(x,y);

  if(L > 1) {
    x /= L;
    y /= L;
  }

  jx = +x.toFixed(2);
  jy = +y.toFixed(2);

  setKnob(jx,jy);
}

joy.addEventListener('pointerdown',e => {
  dragging = true;
  joy.setPointerCapture(e.pointerId);
  joyMove(e);
  sendJoy();
  joyTimer = setInterval(sendJoy,200);
});

joy.addEventListener('pointermove',e => {
  if(dragging) joyMove(e);
});

const joyEnd = () => {

  if(!dragging) return;

  dragging = false;
  clearInterval(joyTimer);

  jx = jy = 0;
  setKnob(0,0);

  cmd({cmd:'stop'});
};

joy.addEventListener('pointerup',joyEnd);
joy.addEventListener('pointercancel',joyEnd);

function sendJoy() {
  cmd({cmd:'joy',x:jx,y:jy});
}

// --------------------------------------------------
// KEYBOARD CONTROLS
// --------------------------------------------------

document.addEventListener('keydown',e => {

  if(e.target.tagName === 'INPUT') return;

  const k = {
    ArrowLeft:[-5,0],
    ArrowRight:[5,0],
    ArrowUp:[0,2],
    ArrowDown:[0,-2]
  }[e.key];

  if(k) {
    e.preventDefault();
    cmd({cmd:'nudge',pan:k[0],tilt:k[1]});
  }

  if(e.key === ' ') {
    e.preventDefault();
    cmd({cmd:'stop'});
  }
});

// --------------------------------------------------
// BUTTON CONTROLS
// --------------------------------------------------

document.querySelectorAll('[data-n]').forEach(b => {

  b.onclick = () => {
    const [p,t] = b.dataset.n.split(',').map(Number);
    cmd({cmd:'nudge',pan:p,tilt:t});
  };

});

$('btnHome').onclick = () => cmd({cmd:'home'});
$('btnStop').onclick = () => cmd({cmd:'stop'});


// speed slider: live while dragging (throttled), final value on release
const speedEl = $('speed');
let speedSent = 0;

speedEl.oninput = () => {
  speedEl.dataset.drag = 1;
  $('speedVal').textContent = speedEl.value+' °/s';
  const t = Date.now();
  if(t-speedSent > 150) {
    speedSent = t;
    cmd({cmd:'speed',value:Number(speedEl.value)});
  }
};

speedEl.onchange = () => {
  cmd({cmd:'speed',value:Number(speedEl.value)});
  delete speedEl.dataset.drag;
};

$('btnSave').onclick = () => {

  const n = $('presetName').value.trim();

  if(/^[A-Za-z0-9_-]{1,10}$/.test(n)) {
    cmd({cmd:'save',name:n});
    $('presetName').value = '';
  } else {
    $('presetName').focus();
  }
};

const zoom = $('zoom');

zoom.oninput = () => {

  zoom.dataset.drag = 1;

  $('zoomVal').textContent =

$('btnFlip').onclick = () => {

};

$('btnRecall').onclick = () => {
  call(C[0]);
};

// --------------------------------------------------
// RECORDING AND SNAPSHOT
// --------------------------------------------------

let rec = null;
let chunks = [];
let recName = '';

function download(blob,name) {

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);
  a.download = name;

  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  },2000);
}

function stamp() {
  return new Date().toISOString()
    .slice(0,19)
    .replace(/[:T]/g,'-');
}

$('btnRec').onclick = () => {

  if(rec) {
    rec.stop();
    return;
  }

  const c = C[0];

  if(!c.stream) {
    $('recNote').textContent = 'No live video on Campus 1.';
    return;
  }

  const type = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ].find(t => MediaRecorder.isTypeSupported(t));

  chunks = [];

  recName =
    `${(cfg.names[0]||'Campus1').replace(/\W+/g,'_')}_${stamp()}.webm`;

  rec = new MediaRecorder(c.stream,{
    mimeType:type,
    videoBitsPerSecond:4000000
  });

  rec.ondataavailable = e => {
    if(e.data.size) chunks.push(e.data);
  };

  rec.onstop = () => {

    download(
      new Blob(chunks,{type:'video/webm'}),
      recName
    );

    rec = null;

    $('btnRec').textContent = '● Record';
    $('btnRec').classList.remove('rec');
    $('recNote').textContent = 'Saved '+recName;
  };

  rec.start(1000);

  $('btnRec').textContent = '■ Stop recording';
  $('btnRec').classList.add('rec');

  $('recNote').textContent = 'Recording Campus 1… keep this tab in front.';
};

$('btnSnap').onclick = () => {

  const v = tile(0).querySelector('video');

  if(!v.videoWidth) {
    $('recNote').textContent = 'No live video on Campus 1.';
    return;
  }

  const cv = document.createElement('canvas');

  cv.width = v.videoWidth;
  cv.height = v.videoHeight;

  cv.getContext('2d').drawImage(v,0,0);

  cv.toBlob(b => {
    if(b) download(b,`snapshot_Campus1_${stamp()}.jpg`);
  },'image/jpeg',0.92);
};

// --------------------------------------------------
// PHONE SETUP LINK
// --------------------------------------------------

function phoneLink() {

  const base = location.href
    .split('#')[0]
    .replace(/console\.html.*$/,'phone.html');

  const data = {
    url:cfg.url,
    user:cfg.user,
    pass:cfg.pass,
    campus:1,
    name:cfg.names[0],
    turn:cfg.turn
  };

  const b64 = btoa(
    unescape(encodeURIComponent(JSON.stringify(data)))
  )
  .replace(/\+/g,'-')
  .replace(/\//g,'_')
  .replace(/=+$/,'');

  return base+'#cfg='+b64;
}

function fillLinks() {

  const L = $('links');
  L.innerHTML = '';

  const r = document.createElement('div');
  r.className = 'row';
  r.style.marginBottom = '6px';

  const inp = document.createElement('input');
  inp.readOnly = true;
  inp.value = phoneLink();
  inp.style.flex = '1';

  const b = document.createElement('button');
  b.textContent = 'Copy Campus 1 link';

  b.onclick = async () => {

    try {
      await navigator.clipboard.writeText(inp.value);
      b.textContent = 'Copied';
    } catch(e) {
      inp.select();
      b.textContent = 'Select + copy';
    }
  };

  r.append(inp,b);
  L.appendChild(r);
}

// SETTINGS DIALOG

$('btnSettings').onclick = () => {

  $('sUrl').value = cfg.url;
  $('sUser').value = cfg.user;
  $('sPass').value = cfg.pass;

  $('n1').value = cfg.names[0] || 'Campus 1';

  $('tUrl').value = cfg.turn.url;
  $('tUser').value = cfg.turn.user;
  $('tPass').value = cfg.turn.pass;

  fillLinks();

};

$('dlgSave').onclick = () => {

  cfg.url = $('sUrl').value.trim();
  cfg.user = $('sUser').value.trim();
  cfg.pass = $('sPass').value;

  cfg.names = [
    $('n1').value.trim() || 'Campus 1'
  ];

  cfg.turn = {
    url:$('tUrl').value.trim(),
    user:$('tUser').value.trim(),
    pass:$('tPass').value
  };

  save();
  fillLinks();
  $('dlg').close();

  render();
  connect();
};

setKnob(0,0);
render();
connect();

if(!cfg.url) {
  $('btnSettings').click();
}
